<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="올바른 분리수거 방법을 알려주는 가이드 앱. 쓰레기 검색으로 어디에 버려야 할지 바로 확인하세요.">
<title>분리수거 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f7f0; color: #2C2C2A; min-height: 100vh; }

  .header { background: #1D9E75; padding: 20px 20px 18px; color: #fff; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 700px; margin: 0 auto; }
  .header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.85; }

  .search-wrap { background: #fff; border-bottom: 1px solid #d0e8d8; padding: 12px 20px; position: sticky; top: 64px; z-index: 99; }
  .search-inner { max-width: 700px; margin: 0 auto; }
  .search-box { display: flex; align-items: center; gap: 8px; background: #f0f7f0; border: 1.5px solid #9FE1CB; border-radius: 24px; padding: 10px 16px; }
  .search-box input { border: none; background: transparent; outline: none; font-size: 15px; flex: 1; color: #2C2C2A; min-width: 0; }
  .search-box input::placeholder { color: #888780; }
  .search-box .ti { font-size: 18px; color: #1D9E75; flex-shrink: 0; }
  #search-clear { cursor: pointer; color: #888780; display: none; }

  .search-result { max-width: 700px; margin: 12px auto 0; border-radius: 14px; border: 1.5px solid #9FE1CB; background: #fff; display: none; overflow: hidden; }
  .sr-header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .sr-icon-wrap { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
  .sr-title { font-size: 16px; font-weight: 600; color: #27500A; }
  .sr-sub { font-size: 12px; color: #639922; margin-top: 2px; }
  .sr-body { padding: 12px 16px 14px; border-top: 1px solid #d0e8d8; }
  .sr-body p { font-size: 14px; color: #444441; line-height: 1.7; }
  .sr-tag { display: inline-block; margin-top: 8px; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }

  .main { max-width: 700px; margin: 0 auto; padding: 16px 16px 40px; }
  .section-title { font-size: 13px; font-weight: 600; color: #639922; margin-bottom: 10px; letter-spacing: 0.04em; text-transform: uppercase; }

  .cats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .cat-card { background: #fff; border-radius: 14px; border: 1.5px solid #d0e8d8; padding: 16px 12px; cursor: pointer; text-align: center; transition: border-color 0.15s, transform 0.1s; user-select: none; }
  .cat-card:hover { border-color: #1D9E75; transform: translateY(-2px); }
  .cat-card:active { transform: scale(0.97); }
  .cat-card.active { border-color: #1D9E75; border-width: 2px; background: #f6fcf9; }
  .cat-icon { font-size: 32px; margin-bottom: 8px; line-height: 1; }
  .cat-name { font-size: 14px; font-weight: 600; color: #27500A; margin-bottom: 3px; }
  .cat-sub { font-size: 11px; color: #639922; }

  .detail-panel { background: #fff; border-radius: 14px; border: 1.5px solid #9FE1CB; overflow: hidden; display: none; margin-bottom: 24px; }
  .dp-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
  .dp-header-title { font-size: 18px; font-weight: 600; color: #fff; }
  .dp-close { margin-left: auto; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 16px; flex-shrink: 0; }
  .dp-close:hover { background: rgba(255,255,255,0.35); }
  .dp-tip { margin: 12px 16px; background: #EAF3DE; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #27500A; display: flex; gap: 8px; align-items: flex-start; line-height: 1.6; }
  .dp-tip .ti { font-size: 16px; flex-shrink: 0; margin-top: 1px; color: #639922; }
  .items-section-label { font-size: 12px; font-weight: 600; color: #639922; padding: 4px 16px 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 0 16px 16px; }
  .item-card { border-radius: 10px; border: 1px solid #d0e8d8; overflow: hidden; text-align: center; }
  .item-img { width: 100%; height: 76px; object-fit: cover; display: block; background: #f0f7f0; }
  .item-img-ph { width: 100%; height: 76px; display: flex; align-items: center; justify-content: center; font-size: 30px; background: #f0f7f0; }
  .item-label { font-size: 12px; padding: 6px 4px; color: #444441; font-weight: 500; line-height: 1.3; }

  .bottom-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
  .tips-card { flex: 1; min-width: 200px; background: #fff; border-radius: 14px; border: 1.5px solid #d0e8d8; padding: 16px; }
  .tips-card h3 { font-size: 14px; font-weight: 600; color: #27500A; margin-bottom: 10px; }
  .tip-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; color: #444441; line-height: 1.5; }
  .tip-row .ti { font-size: 15px; color: #1D9E75; flex-shrink: 0; margin-top: 1px; }
  .qr-card { background: #fff; border-radius: 14px; border: 1.5px solid #d0e8d8; padding: 16px; text-align: center; min-width: 160px; }
  .qr-card h3 { font-size: 14px; font-weight: 600; color: #27500A; margin-bottom: 10px; }
  #qr-wrap canvas, #qr-wrap img { border-radius: 6px; }
  .qr-note { font-size: 11px; color: #888780; margin-top: 8px; }

  @media (max-width: 480px) {
    .header { padding: 14px 16px 12px; }
    .search-wrap { top: 56px; padding: 10px 16px; }
    .cats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat-card { padding: 12px 8px; }
    .cat-icon { font-size: 26px; margin-bottom: 6px; }
    .cat-name { font-size: 13px; }
    .cat-sub { font-size: 10px; }
    .items-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1><i class="ti ti-recycle"></i> 분리수거 가이드</h1>
    <p>올바른 분리배출로 환경을 지켜요</p>
  </div>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input id="search-input" type="text" placeholder="쓰레기를 검색해보세요 (예: 빠삐코, 우유팩, 종이컵...)" autocomplete="off" autocorrect="off">
      <i class="ti ti-x" id="search-clear"></i>
    </div>
  </div>
  <div class="search-inner">
    <div class="search-result" id="search-result">
      <div class="sr-header" id="sr-header"></div>
      <div class="sr-body" id="sr-body"></div>
    </div>
  </div>
</div>

<div class="main">
  <p class="section-title">카테고리 선택</p>
  <div class="cats-grid" id="cats-grid"></div>

  <div class="detail-panel" id="detail-panel">
    <div class="dp-header" id="dp-header">
      <button class="dp-close" id="dp-close" aria-label="닫기"><i class="ti ti-x"></i></button>
    </div>
    <div class="dp-tip" id="dp-tip"></div>
    <div class="items-section-label">버릴 수 있는 항목들</div>
    <div class="items-grid" id="items-grid"></div>
  </div>

  <div class="bottom-row">
    <div class="tips-card">
      <h3><i class="ti ti-sparkles" style="color:#1D9E75"></i> 분리수거 핵심 원칙</h3>
      <div class="tip-row"><i class="ti ti-circle-check"></i>내용물을 깨끗이 비운 후 버리세요</div>
      <div class="tip-row"><i class="ti ti-circle-check"></i>라벨·뚜껑은 분리해서 각각 버려요</div>
      <div class="tip-row"><i class="ti ti-circle-check"></i>음식물이 묻었다면 일반쓰레기로</div>
      <div class="tip-row"><i class="ti ti-circle-check"></i>물기를 제거하고 배출하세요</div>
      <div class="tip-row"><i class="ti ti-circle-check"></i>부피가 크면 납작하게 눌러서 버려요</div>
    </div>
    <div class="qr-card">
      <h3>이 페이지 QR</h3>
      <div id="qr-wrap"></div>
      <p class="qr-note">스캔하면 바로 접속돼요</p>
    </div>
  </div>
</div>

function getCat(id){ return CATS.find(c=>c.id===id); }

function renderCats(){
  const grid = document.getElementById('cats-grid');
  CATS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.setAttribute('data-id', c.id);
    card.innerHTML = '<div class="cat-icon">'+c.icon+'</div><div class="cat-name">'+c.name+'</div><div class="cat-sub">'+c.sub+'</div>';
    card.addEventListener('click', () => showDetail(c.id));
    grid.appendChild(card);
  });
}

function showDetail(id){
  document.querySelectorAll('.cat-card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  const cat = getCat(id);
  const header = document.getElementById('dp-header');
  header.style.background = cat.borderColor;
  header.innerHTML = '<span style="font-size:26px">'+cat.icon+'</span><span class="dp-header-title">'+cat.name+'</span><button class="dp-close" id="dp-close" aria-label="닫기"><i class="ti ti-x"></i></button>';
  document.getElementById('dp-close').addEventListener('click', closeDetail);
  document.getElementById('dp-tip').innerHTML = '<i class="ti ti-bulb"></i><span>'+cat.tip+'</span>';
  const grid = document.getElementById('items-grid');
  grid.innerHTML = '';
  cat.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    const img = document.createElement('img');
    img.className = 'item-img';
    img.src = item.img;
    img.alt = item.label;
    img.loading = 'lazy';
    img.onerror = function(){
      this.style.display = 'none';
      const ph = document.createElement('div');
      ph.className = 'item-img-ph';
      ph.textContent = item.emoji;
      this.parentNode.insertBefore(ph, this);
    };
    const label = document.createElement('div');
    label.className = 'item-label';
    label.textContent = item.label;
    card.appendChild(img);
    card.appendChild(label);
    grid.appendChild(card);
  });
  const panel = document.getElementById('detail-panel');
  panel.style.display = 'block';
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function closeDetail(){
  document.getElementById('detail-panel').style.display = 'none';
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
}

function doSearch(val){
  const sr = document.getElementById('search-result');
  if(!val.trim()){ sr.style.display = 'none'; return; }
  const lower = val.trim();
  const match = SEARCH_DB.find(e => e.q.some(kw => kw.includes(lower) || lower.includes(kw)));
  const header = document.getElementById('sr-header');
  const body = document.getElementById('sr-body');
  if(match){
    const cat = getCat(match.cat);
    header.innerHTML = '<div class="sr-icon-wrap" style="background:'+cat.color+';border:1px solid '+cat.borderColor+'">'+cat.icon+'</div><div><div class="sr-title">'+cat.name+'으로 버려요</div><div class="sr-sub">'+cat.sub+'</div></div>';
    body.innerHTML = '<p>'+match.note+'</p><span class="sr-tag" style="background:'+cat.color+';color:'+cat.textColor+';border:0.5px solid '+cat.borderColor+'">'+cat.name+' 분리수거</span>';
  } else {
    header.innerHTML = '<div class="sr-icon-wrap" style="background:#F1EFE8;border:1px solid #B4B2A9">🤔</div><div><div class="sr-title" style="color:#444441">"'+lower+'" 검색 결과</div><div class="sr-sub">항목을 찾지 못했어요</div></div>';
    body.innerHTML = '<p style="color:#888780">카테고리를 눌러 직접 확인하거나 다른 단어로 검색해보세요.</p>';
  }
  sr.style.display = 'block';
}

document.getElementById('search-input').addEventListener('input', function(){
  document.getElementById('search-clear').style.display = this.value ? 'block' : 'none';
  doSearch(this.value);
});
document.getElementById('search-clear').addEventListener('click', function(){
  document.getElementById('search-input').value = '';
  this.style.display = 'none';
  document.getElementById('search-result').style.display = 'none';
});

function makeQR(){
  const url = window.location.href.split('?')[0];
  try {
    new QRCode(document.getElementById('qr-wrap'), {
      text: url, width: 120, height: 120,
      colorDark: '#1D9E75', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e){}
}

renderCats();
window.addEventListener('load', makeQR);
</script>
